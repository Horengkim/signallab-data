# 매크로렌즈 시세 갱신 + 텔레그램 발송
# 깃허브 액션이 5분마다 돌아 data/*.json 을 새로 쓰고, 방향이 바뀐 종목만 알린다.
#
# 알아둘 것
#   · 액션 크론의 최소 주기가 정확히 5분이다. 우리 봉 길이와 맞는다.
#   · 부하가 몰리면 몇 분 늦거나 건너뛸 수 있다. 실시간이 아니다.
#   · 공개 저장소는 액션 시간이 무제한이다.
#   · 스스로 커밋하므로 60일 미활동 자동 비활성화에 걸리지 않는다.
#
# 필요한 Secret 은 하나뿐이다 (Settings → Secrets and variables → Actions)
#   TELEGRAM_BOT_TOKEN   BotFather 가 준 토큰. 이것만 비밀이다.
#
# 채널 핸들은 왜 Secret 이 아닌가 —
#   공개 채널의 @핸들은 홈페이지에도 적히고 유튜브에도 적힌다. 숨길 것이
#   아니다. 그런데 Secret 에 넣으면 값이 가려져서 오타가 나도 눈에 안 보이고,
#   고치려면 매번 본인확인을 거쳐야 한다. 실제로 그 두 가지가 다 발목을
#   잡았다. 공개 정보는 공개된 자리에 둔다 — 틀리면 바로 보이도록.
#   비공개 채널로 바꾸면 -100 으로 시작하는 숫자 ID 로 교체하면 된다.
name: update
on:
  schedule:
    - cron: '3-58/5 * * * *'    # 정시를 피한다 — 그때가 가장 붐빈다
  workflow_dispatch:            # 손으로도 돌릴 수 있게

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  TELEGRAM_CHANNEL_ID: '@signallab_trading'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: 시세 수집
        run: node scripts/fetch.mjs
        env:
          TF: '5'

      # 발송이 실패해도 시세 커밋은 남아야 한다. continue-on-error 를 둔 이유.
      - name: 텔레그램 발송
        continue-on-error: true
        run: node scripts/notify.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: 커밋
        run: |
          git config user.name  "macrolens-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "바뀐 것 없음" && exit 0
          git commit -m "시세 $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
